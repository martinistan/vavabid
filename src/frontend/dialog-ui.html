<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umutistan • Onay</title><link rel="stylesheet" href="ui-theme.css"><style>
body{display:grid;place-items:center;min-height:100vh;padding:24px;background:#020705}.dialog{width:min(100%,460px);padding:32px;border:1px solid #294c3c;border-radius:18px;background:#0a120e;box-shadow:0 28px 80px #000}.eyebrow{color:#40e7aa;font-size:11px;letter-spacing:2px;margin-bottom:14px}h1{font-size:24px;font-weight:600;line-height:1.3;margin:0 0 12px}p{color:#a4b9ac;font-size:14px;margin-bottom:24px}input[type=text]{width:100%;height:44px;margin:8px 0 18px;border:1px solid #395747;border-radius:8px;background:#000;color:#fff;padding:0 12px;font-size:15px}label{font-size:13px;color:#bdcfc4}.pin{display:flex;gap:9px;align-items:center}input[type=checkbox]{accent-color:#40e7aa;width:16px;height:16px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:28px;flex-wrap:wrap}button{padding:10px 18px;min-height:42px;border:1px solid #344a3d;background:#132219;color:#d5e6dc;border-radius:9px;font-size:13px;cursor:pointer}#confirm{background:#40e7aa;color:#002417;border-color:#40e7aa}#confirm.danger{background:#ef7a89;border-color:#ef7a89;color:#27050b}.hint{font-size:12px;color:#789482;margin-top:12px}
</style></head><body><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><div class="eyebrow">UMUTİSTAN</div><h1 id="title"></h1><p id="description"></p><div id="edit"><label for="name">Sekme adı</label><input id="name" type="text" maxlength="80"><label class="pin"><input type="checkbox" id="pinned">Sekmeyi sabitle</label><div class="hint">Adı boş bırakırsanız sayfa başlığı kullanılır. Sabit sekmenin kapatma düğmesi gizlenir.</div></div><div class="actions"><button id="cancel">Vazgeç</button><button id="confirm">Kaydet</button></div></section><script>
const nameInput=document.getElementById('name'),pin=document.getElementById('pinned'),confirm=document.getElementById('confirm');let mode='rename';function send(action){if(window.chrome?.webview)chrome.webview.postMessage({action,name:nameInput.value,pinned:pin.checked});}
window.showDialog=d=>{mode=d.mode;const edit=mode==='rename';document.getElementById('edit').hidden=!edit;document.getElementById('title').textContent=edit?'Sekmeyi düzenle':mode==='close-app'?'Uygulamayı kapatmak istiyor musunuz?':'Aktif ihaleyi kapatmak istiyor musunuz?';document.getElementById('description').textContent=edit?'Aktif sekmeye tanıyabileceğiniz bir ad verin.':mode==='close-app'?d.count+' sekmede otomatik izleme açık. Kapatırsanız bu masaüstü izlemeleri duracak.':'Bu sekmede otomatik izleme açık. Sekmeyi kapatmak izlemeyi durduracak.';nameInput.value=d.name||'';pin.checked=!!d.pinned;confirm.textContent=edit?'Kaydet':'İzlemeyi durdur ve kapat';confirm.classList.toggle('danger',!edit);setTimeout(()=>{(edit?nameInput:document.getElementById('cancel')).focus();if(edit)nameInput.select();},50);};document.getElementById('cancel').onclick=()=>send('cancel');confirm.onclick=()=>send('confirm');document.addEventListener('keydown',e=>{if(e.key==='Escape')send('cancel');if(e.key==='Enter'&&mode==='rename')send('confirm');if(e.key==='Tab'){const focusable=[...document.querySelectorAll('button,input')].filter(x=>x.offsetParent!==null),first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
</script></body></html>

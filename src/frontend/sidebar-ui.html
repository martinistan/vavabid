<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umutistan Luxury Sniper HUD</title>
  <style>
    :root {
      --bg-hud: #07090c;
      --bg-pill: #10131a;
      --bg-pill-hover: #181d28;
      --border: #1e2430;
      --border-focus: #3b82f6;
      --accent-emerald: #10b981;
      --accent-emerald-glow: rgba(16, 185, 129, 0.4);
      --accent-cyan: #06b6d4;
      --accent-amber: #fbbf24;
      --accent-red: #ef4444;
      --text-main: #f4f4f6;
      --text-muted: #8e8e9e;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --font-mono: "Consolas", "JetBrains Mono", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-hud);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 48px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 10px;
      border-bottom: 1px solid #141c1a;
      border-top: none;
    }

    /* Section 1: Timer & Arm Status */
    .hud-timer-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .hud-timer {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-amber);
      letter-spacing: 1px;
      min-width: 90px;
      text-align: center;
      padding: 3px 6px;
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .hud-timer.danger {
      color: var(--accent-red);
      border-color: rgba(239, 68, 68, 0.6);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .hud-badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.5px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .hud-badge.offline {
      background: #141720;
      color: #888894;
      border-color: #262c3a;
    }

    .hud-badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-emerald);
      border-color: var(--accent-emerald);
    }

    .hud-btn-arm {
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .hud-btn-arm.green {
      background: #10b981;
      color: #000;
    }

    .hud-btn-arm.green:hover {
      background: #059669;
    }

    .hud-btn-arm.red {
      background: #ef4444;
      color: #fff;
    }

    /* Section 2: Stepper Pills (Directly Editable Inputs + 1-by-1 Continuous Hold) */
    .hud-steppers-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .hud-pill {
      height: 30px;
      background: var(--bg-pill);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 3px;
      gap: 3px;
    }

    .hud-pill-lbl {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-step-btn {
      width: 20px;
      height: 22px;
      background: #191f2c;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
      touch-action: none;
    }

    .hud-step-btn:hover {
      background: #232b3d;
      border-color: #3b4860;
    }

    .hud-step-btn:active {
      background: #2f3a52;
      color: var(--accent-emerald);
    }

    .hud-input-wrap {
      display: flex;
      align-items: center;
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 3px;
      height: 22px;
      transition: border-color 0.15s ease;
    }

    .hud-input-wrap:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.35);
    }

    .hud-pill-input {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
      background: transparent;
      border: none;
      outline: none;
      width: 36px;
      text-align: center;
      -moz-appearance: textfield;
      user-select: text;
      -webkit-user-select: text;
    }

    .hud-pill-input::-webkit-outer-spin-button,
    .hud-pill-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .hud-pill-unit {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent-emerald);
      padding-right: 2px;
    }

    /* Chrome Navigation Group (Geri, İleri, Yenile / F5) */
    .chrome-nav-group {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .chrome-nav-btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 50%;
      color: #9da3af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      outline: none;
    }

    .chrome-nav-btn:hover {
      background: #1c2230;
      border-color: #2b3548;
      color: #fff;
    }

    .chrome-nav-btn:active {
      background: #2a344a;
      transform: scale(0.92);
    }

    .nav-svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Section 3: Chrome Omnibox / Web URL */
    .hud-url-group {
      flex: 1;
      min-width: 200px;
      max-width: 440px;
      position: relative;
      display: flex;
      align-items: center;
      background: #11141c;
      border: 1px solid #222938;
      border-radius: 16px;
      height: 28px;
      padding: 0 4px 0 10px;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .hud-url-group:focus-within {
      background: #0b0d14;
      border-color: var(--border-focus);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.35);
    }

    .hud-url-icon {
      font-size: 12px;
      color: var(--accent-cyan);
      flex-shrink: 0;
    }

    .hud-url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      min-width: 0;
      user-select: text;
      -webkit-user-select: text;
    }

    .hud-url-input::placeholder {
      color: #555566;
    }

    .hud-btn-go {
      height: 22px;
      padding: 0 8px;
      background: #10b981;
      border: none;
      border-radius: 4px;
      color: #000;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .hud-btn-go:hover {
      background: #059669;
    }

    .hud-btn-sub {
      height: 22px;
      padding: 0 6px;
      background: #161b26;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #b0b0c0;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .hud-btn-sub:hover {
      background: #202738;
      color: #fff;
    }

    .hud-url-feedback {
      position: absolute;
      bottom: -18px;
      left: 6px;
      font-size: 9.5px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .hud-url-feedback.ok {
      color: var(--accent-emerald);
    }

    .hud-url-feedback.error {
      color: var(--accent-red);
    }

    /* Section 4: Quick Action Buttons */
    .hud-actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .hud-chk-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .hud-chk-label input {
      accent-color: var(--accent-emerald);
      cursor: pointer;
      width: 13px;
      height: 13px;
    }

    .hud-icon-btn {
      width: 26px;
      height: 26px;
      background: #12151e;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #9494a4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .hud-icon-btn:hover {
      background: #1c2230;
      color: #fff;
      border-color: #3b4860;
    }

    .hud-select {
      height: 24px;
      background: #12151e;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: #9494a4;
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      padding: 0 4px;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
    }

    .hud-select:hover {
      background: #1c2230;
      border-color: #3b4860;
      color: #fff;
    }

    .hud-select:focus {
      border-color: var(--border-focus);
    }

    .hud-btn-abort {
      height: 24px;
      padding: 0 7px;
      background: #dc2626;
      border: 1px solid #f87171;
      border-radius: 5px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      animation: pulse 1s infinite;
      white-space: nowrap;
    }

    .ui-icon {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .control-drawer { display: none; }
  </style>
  <link rel="stylesheet" href="ui-theme.css">
</head>
<body class="hud-bar top-dock">

  <!-- 1. Chrome Navigasyon Butonları (Geri, İleri, Yenile / F5) -->
  <div class="chrome-nav-group">
    <button id="btnNavBack" class="chrome-nav-btn" title="Back (Alt + Left Arrow)" onclick="sendAction('nav_back')">
      <svg class="nav-svg" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="btnNavForward" class="chrome-nav-btn" title="Forward (Alt + Right Arrow)" onclick="sendAction('nav_forward')">
      <svg class="nav-svg" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button id="btnReload" class="chrome-nav-btn" title="Reload (F5 / Ctrl + R)" onclick="sendAction('nav_reload')">
      <svg class="nav-svg" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>

  <!-- 2. Chrome Omnibox / Web URL -->
  <div class="hud-url-group">
    <span class="hud-url-icon" title="Secure Connection (VakantieVeilingen)">🔒</span>
    <input type="text" id="txtAuctionUrl" class="hud-url-input" 
           placeholder="veilingen/... or https://www.vakantieveilingen.nl/veilingen/..." 
           spellcheck="false" autocomplete="off" 
           onkeydown="handleUrlKey(event)">
    <button id="btnGoUrl" class="hud-btn-go" onclick="submitUrl(false)" title="Go to Auction (Enter)">➔ Go</button>
    <button id="btnPasteUrl" class="hud-btn-sub" onclick="pasteAndGo()" title="Paste from Clipboard & Go">📋 Paste</button>
    <button id="btnNewTab" class="hud-btn-sub" onclick="submitUrl(true)" title="Open in New Tab">+ Tab</button>
    <div id="urlFeedback" class="hud-url-feedback"></div>
  </div>

  <!-- 3. Geri Sayım & Bot Durumu -->
  <div class="hud-timer-group">
    <div id="countdown" class="hud-timer" title="Time remaining">00:00:01</div>
    <button id="badgeStatus" class="hud-badge offline" onclick="sendAction('toggle_arm')" title="Status: Click to toggle">OFFLINE</button>
    <button id="btnArmToggle" class="hud-btn-arm green" onclick="sendAction('toggle_arm')">⚡ START SNIPER</button>
  </div>

  <!-- 4. Hızlı Stepper Ayarları (Doğrudan Yazılabilir Input + Basılı Tutunca Hızlı Artırma/Azaltma) -->
  <div class="hud-steppers-group">
    <div class="hud-pill" title="Maximum Bid Limit">
      <span id="lblLimit" class="hud-pill-lbl">LIMIT</span>
      <button class="hud-step-btn" 
              onmousedown="startHold('max', -1)" 
              onmouseup="stopHold()" 
              onmouseleave="stopHold()" 
              ontouchstart="startHold('max', -1)" 
              ontouchend="stopHold()">−</button>
      <div class="hud-input-wrap">
        <input type="number" id="valMax" class="hud-pill-input" value="32" min="1" max="99999" step="1"
               oninput="onNumberInput('max', this.value)"
               onchange="onNumberChange('max', this.value)">
        <span class="hud-pill-unit">€</span>
      </div>
      <button class="hud-step-btn" 
              onmousedown="startHold('max', 1)" 
              onmouseup="stopHold()" 
              onmouseleave="stopHold()" 
              ontouchstart="startHold('max', 1)" 
              ontouchend="stopHold()">+</button>
    </div>

    <div class="hud-pill" title="Bid Increment Step">
      <span id="lblStep" class="hud-pill-lbl">STEP</span>
      <button class="hud-step-btn" 
              onmousedown="startHold('step', -1)" 
              onmouseup="stopHold()" 
              onmouseleave="stopHold()" 
              ontouchstart="startHold('step', -1)" 
              ontouchend="stopHold()">−</button>
      <div class="hud-input-wrap">
        <input type="number" id="valStep" class="hud-pill-input" value="1" min="1" max="1000" step="1"
               oninput="onNumberInput('step', this.value)"
               onchange="onNumberChange('step', this.value)">
        <span class="hud-pill-unit">€</span>
      </div>
      <button class="hud-step-btn" 
              onmousedown="startHold('step', 1)" 
              onmouseup="stopHold()" 
              onmouseleave="stopHold()" 
              ontouchstart="startHold('step', 1)" 
              ontouchend="stopHold()">+</button>
    </div>

    <div class="hud-pill" title="Trigger Countdown Seconds">
      <span id="lblTrigger" class="hud-pill-lbl">TRIGGER</span>
      <button class="hud-step-btn" 
              onmousedown="startHold('sec', -1)" 
              onmouseup="stopHold()" 
              onmouseleave="stopHold()" 
              ontouchstart="startHold('sec', -1)" 
              ontouchend="stopHold()">−</button>
      <div class="hud-input-wrap">
        <input type="number" id="valSec" class="hud-pill-input" value="1" min="1" max="60" step="1"
               oninput="onNumberInput('sec', this.value)"
               onchange="onNumberChange('sec', this.value)">
        <span id="lblSecUnit" class="hud-pill-unit">s</span>
      </div>
      <button class="hud-step-btn" 
              onmousedown="startHold('sec', 1)" 
              onmouseup="stopHold()" 
              onmouseleave="stopHold()" 
              ontouchstart="startHold('sec', 1)" 
              ontouchend="stopHold()">+</button>
    </div>
  </div>

  <!-- 4. Ek Araçlar & Kısayollar -->
  <div class="hud-actions-group">
    <label class="hud-chk-label" title="Stop remaining tabs upon winning first auction">
      <input type="checkbox" id="chkStopWin" checked onchange="sendCheckbox('stop_on_win', this.checked)">
      <span id="lblStopWin">Stop on Win</span>
    </label>
    <select id="selShutdown" class="hud-select" onchange="sendAction('set_shutdown_mode', { mode: this.value })" title="PC Auto-Shutdown Mode">
      <option value="none">PC: Disabled</option>
      <option value="on_end">PC: On End</option>
      <option value="on_limit">PC: On Limit</option>
      <option value="on_any">PC: End/Limit</option>
    </select>
    <button id="btnAbortShutdown" class="hud-btn-abort" style="display:none;" onclick="sendAction('abort_shutdown')" title="Abort Shutdown (shutdown /a)">⛔ ABORT (60s)</button>
    <button id="btnCopyUrl" class="hud-icon-btn" title="Copy Auction URL" onclick="sendAction('copy_url')">
      <svg class="ui-icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </button>
    <button id="btnCopyMobile" class="hud-icon-btn" title="Copy Mobile WiFi Link" onclick="sendAction('copy_mobile')">
      <svg class="ui-icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 18h.01"/></svg>
    </button>
    <select id="selLang" class="hud-select" onchange="applyLang(this.value)" title="Language / Dil / Taal">
      <option value="en" selected>🌐 EN</option>
      <option value="tr">🌐 TR</option>
      <option value="nl">🌐 NL</option>
    </select>
  </div>

  <script>
    const i18n = {
      en: {
        nav_back: 'Back (Alt + Left Arrow)',
        nav_forward: 'Forward (Alt + Right Arrow)',
        nav_reload: 'Reload (F5 / Ctrl + R)',
        url_placeholder: 'veilingen/... or https://www.vakantieveilingen.nl/veilingen/...',
        btn_go: '➔ Go',
        btn_paste: '📋 Paste',
        btn_tab: '+ Tab',
        arm_start: '⚡ START SNIPER',
        arm_stop: '🛑 STOP SNIPER',
        lbl_limit: 'LIMIT',
        lbl_step: 'STEP',
        lbl_trigger: 'TRIGGER',
        lbl_sec_unit: 's',
        stop_on_win: 'Stop on Win',
        pc_none: 'PC: Disabled',
        pc_on_end: 'PC: On End',
        pc_on_limit: 'PC: On Limit',
        pc_on_any: 'PC: End/Limit',
        btn_abort: '⛔ ABORT',
        btn_shutting_down: '⛔ SHUTTING DOWN...',
        copy_url: 'Copy Auction URL',
        copy_mobile: 'Copy Mobile WiFi Link'
      },
      tr: {
        nav_back: 'Geri (Alt + Sol Ok)',
        nav_forward: 'İleri (Alt + Sağ Ok)',
        nav_reload: 'Sayfayı Yenile (F5 / Ctrl + R)',
        url_placeholder: 'veilingen/... veya https://www.vakantieveilingen.be/veilingen/...',
        btn_go: '➔ Git',
        btn_paste: '📋 Yapıştır',
        btn_tab: '+ Sekme',
        arm_start: '⚡ İZLEME BAŞLAT',
        arm_stop: '🛑 İZLEMEYİ DURDUR',
        lbl_limit: 'LİMİT',
        lbl_step: 'ARTIŞ',
        lbl_trigger: 'TETİK',
        lbl_sec_unit: 'sn',
        stop_on_win: 'Kazanmada Durdur',
        pc_none: 'PC: Kapalı',
        pc_on_end: 'PC: İhale Bitişi',
        pc_on_limit: 'PC: Limit Aşımı',
        pc_on_any: 'PC: Bitiş/Limit',
        btn_abort: '⛔ İPTAL',
        btn_shutting_down: '⛔ KAPATILIYOR...',
        copy_url: 'İhale URL Kopyala',
        copy_mobile: 'Mobil WiFi Linki Kopyala'
      },
      nl: {
        nav_back: 'Terug (Alt + Links)',
        nav_forward: 'Vooruit (Alt + Rechts)',
        nav_reload: 'Pagina Vernieuwen (F5 / Ctrl + R)',
        url_placeholder: 'veilingen/... of https://www.vakantieveilingen.nl/veilingen/...',
        btn_go: '➔ Ga',
        btn_paste: '📋 Plakken',
        btn_tab: '+ Tab',
        arm_start: '⚡ START SNIPER',
        arm_stop: '🛑 STOP SNIPER',
        lbl_limit: 'LIMIET',
        lbl_step: 'STAP',
        lbl_trigger: 'TRIGGER',
        lbl_sec_unit: 'sec',
        stop_on_win: 'Stop bij winst',
        pc_none: 'PC: Uit',
        pc_on_end: 'PC: Na afloop',
        pc_on_limit: 'PC: Bij limiet',
        pc_on_any: 'PC: Einde/Limiet',
        btn_abort: '⛔ ANNULEER',
        btn_shutting_down: '⛔ AFSLUITEN...',
        copy_url: 'Veiling URL kopiëren',
        copy_mobile: 'Mobiele WiFi link kopiëren'
      }
    };

    let currentLang = localStorage.getItem('ui_lang') || 'en';

    function t(key) {
      const dict = i18n[currentLang] || i18n.en;
      return dict[key] || (i18n.en && i18n.en[key]) || key;
    }

    function applyLang(lang) {
      if (lang && i18n[lang]) {
        currentLang = lang;
        try { localStorage.setItem('ui_lang', lang); } catch (e) {}
      }
      const sel = document.getElementById('selLang');
      if (sel && sel.value !== currentLang) sel.value = currentLang;

      const btnNavBack = document.getElementById('btnNavBack');
      if (btnNavBack) btnNavBack.title = t('nav_back');
      const btnNavForward = document.getElementById('btnNavForward');
      if (btnNavForward) btnNavForward.title = t('nav_forward');
      const btnReload = document.getElementById('btnReload');
      if (btnReload) btnReload.title = t('nav_reload');

      const txtAuctionUrl = document.getElementById('txtAuctionUrl');
      if (txtAuctionUrl) txtAuctionUrl.placeholder = t('url_placeholder');
      const btnGoUrl = document.getElementById('btnGoUrl');
      if (btnGoUrl) btnGoUrl.innerText = t('btn_go');
      const btnPasteUrl = document.getElementById('btnPasteUrl');
      if (btnPasteUrl) btnPasteUrl.innerText = t('btn_paste');
      const btnNewTab = document.getElementById('btnNewTab');
      if (btnNewTab) btnNewTab.innerText = t('btn_tab');

      const lblLimit = document.getElementById('lblLimit');
      if (lblLimit) lblLimit.innerText = t('lbl_limit');
      const lblStep = document.getElementById('lblStep');
      if (lblStep) lblStep.innerText = t('lbl_step');
      const lblTrigger = document.getElementById('lblTrigger');
      if (lblTrigger) lblTrigger.innerText = t('lbl_trigger');
      const lblSecUnit = document.getElementById('lblSecUnit');
      if (lblSecUnit) lblSecUnit.innerText = t('lbl_sec_unit');
      const lblStopWin = document.getElementById('lblStopWin');
      if (lblStopWin) lblStopWin.innerText = t('stop_on_win');

      const selShutdown = document.getElementById('selShutdown');
      if (selShutdown && selShutdown.options.length >= 4) {
        selShutdown.options[0].text = t('pc_none');
        selShutdown.options[1].text = t('pc_on_end');
        selShutdown.options[2].text = t('pc_on_limit');
        selShutdown.options[3].text = t('pc_on_any');
      }

      const btnArmToggle = document.getElementById('btnArmToggle');
      if (btnArmToggle) {
        btnArmToggle.innerText = state.armed ? t('arm_stop') : t('arm_start');
      }

      const btnCopyUrl = document.getElementById('btnCopyUrl');
      if (btnCopyUrl) btnCopyUrl.title = t('copy_url');
      const btnCopyMobile = document.getElementById('btnCopyMobile');
      if (btnCopyMobile) btnCopyMobile.title = t('copy_mobile');
    }

    let state = {
      max: 32,
      step: 1,
      sec: 1,
      armed: false
    };

    let holdTimer = null;
    let holdInterval = null;

    function startHold(param, delta) {
      stopHold();
      stepChange(param, delta);
      holdTimer = setTimeout(() => {
        holdInterval = setInterval(() => {
          stepChange(param, delta);
        }, 65);
      }, 350);
    }

    function stopHold() {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
    }

    // TextContent compatibility for tests
    ['valMax', 'valStep', 'valSec'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        Object.defineProperty(el, 'textContent', {
          get: function() {
            const unit = id === 'valSec' ? ' sn' : ' €';
            return this.value + unit;
          },
          configurable: true
        });
      }
    });

    function sendAction(actionName, extra) {
      if (window.chrome && window.chrome.webview) {
        const payload = Object.assign({ action: actionName }, extra || {});
        window.chrome.webview.postMessage(payload);
      }
    }

    function stepChange(param, delta) {
      if (param === 'max') {
        state.max = Math.max(1, state.max + delta);
        const el = document.getElementById('valMax');
        if (el) el.value = state.max;
      } else if (param === 'step') {
        state.step = Math.max(1, state.step + delta);
        const el = document.getElementById('valStep');
        if (el) el.value = state.step;
      } else if (param === 'sec') {
        state.sec = Math.max(1, Math.min(60, state.sec + delta));
        const el = document.getElementById('valSec');
        if (el) el.value = state.sec;
      }

      sendAction('update_params', {
        max: state.max,
        step: state.step,
        sec: state.sec
      });
    }

    function onNumberInput(param, raw) {
      const val = parseInt(raw, 10);
      if (isNaN(val) || val < 1) return;
      if (param === 'max') state.max = val;
      else if (param === 'step') state.step = val;
      else if (param === 'sec') state.sec = Math.min(60, val);

      sendAction('update_params', {
        max: state.max,
        step: state.step,
        sec: state.sec
      });
    }

    function onNumberChange(param, raw) {
      let val = parseInt(raw, 10);
      if (isNaN(val) || val < 1) val = (param === 'max' ? 32 : 1);
      if (param === 'max') {
        state.max = val;
        document.getElementById('valMax').value = val;
      } else if (param === 'step') {
        state.step = val;
        document.getElementById('valStep').value = val;
      } else if (param === 'sec') {
        state.sec = Math.min(60, Math.max(1, val));
        document.getElementById('valSec').value = state.sec;
      }

      sendAction('update_params', {
        max: state.max,
        step: state.step,
        sec: state.sec
      });
    }

    function sendCheckbox(key, val) {
      sendAction('update_checkbox', { key: key, value: val });
    }

    function handleUrlKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitUrl(false);
      }
    }

    function submitUrl(inNewTab) {
      const input = document.getElementById('txtAuctionUrl');
      const val = (input ? input.value : '').trim();
      if (!val) {
        showFeedback(false, 'Lütfen bir URL girin');
        return;
      }
      sendAction(inNewTab ? 'new_tab_url' : 'navigate_url', { url: val });
    }

    function pasteAndGo() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(text => {
          if (text) {
            const input = document.getElementById('txtAuctionUrl');
            if (input) input.value = text.trim();
            submitUrl(false);
          }
        }).catch(() => {
          sendAction('paste_url');
        });
      } else {
        sendAction('paste_url');
      }
    }

    window.setAuctionUrlInput = function(url) {
      const input = document.getElementById('txtAuctionUrl');
      if (input) {
        input.value = url;
        submitUrl(false);
      }
    };

    window.updateCurrentUrl = function(url) {
      const input = document.getElementById('txtAuctionUrl');
      if (!input) return;
      if (document.activeElement !== input) {
        input.value = url || '';
      }
    };

    window.showUrlFeedback = function(ok, msg, normUrl) {
      const fb = document.getElementById('urlFeedback');
      if (!fb) return;
      fb.className = 'hud-url-feedback ' + (ok ? 'ok' : 'error');
      fb.innerText = msg;
      fb.style.opacity = '1';
      if (ok && normUrl) {
        const input = document.getElementById('txtAuctionUrl');
        if (input && document.activeElement !== input) input.value = normUrl;
      }
      setTimeout(() => { fb.style.opacity = '0'; }, 4000);
    };

    function showFeedback(ok, msg) {
      window.showUrlFeedback(ok, msg);
    }

    window.updateHud = function(timeStr, isArmed, max, step, sec, secLeft) {
      const cd = document.getElementById('countdown');
      if (cd) {
        cd.innerText = timeStr;
        if (secLeft <= 5 && isArmed) cd.classList.add('danger');
        else cd.classList.remove('danger');
      }

      state.armed = !!isArmed;
      const badge = document.getElementById('badgeStatus');
      const btn = document.getElementById('btnArmToggle');
      if (badge && btn) {
        if (state.armed) {
          badge.className = 'hud-badge online';
          badge.innerText = 'ONLINE';
          btn.className = 'hud-btn-arm red';
          btn.innerText = '🛑 İZLEMEYİ DURDUR';
        } else {
          badge.className = 'hud-badge offline';
          badge.innerText = 'OFFLINE';
          btn.className = 'hud-btn-arm green';
          btn.innerText = '⚡ İZLEME BAŞLAT';
        }
      }

      if (max !== undefined) {
        state.max = Number(max);
        const el = document.getElementById('valMax');
        if (el && document.activeElement !== el) el.value = state.max;
      }
      if (step !== undefined) {
        state.step = Number(step);
        const el = document.getElementById('valStep');
        if (el && document.activeElement !== el) el.value = state.step;
      }
      if (sec !== undefined) {
        state.sec = Number(sec);
        const el = document.getElementById('valSec');
        if (el && document.activeElement !== el) el.value = state.sec;
      }
    };

    let shutdownInterval = null;
    window.onShutdownCountdown = function(seconds) {
      const btn = document.getElementById('btnAbortShutdown');
      if (!btn) return;
      btn.style.display = 'inline-flex';
      let left = Number(seconds) || 60;
      btn.innerText = '⛔ İPTAL (' + left + 's)';
      if (shutdownInterval) clearInterval(shutdownInterval);
      shutdownInterval = setInterval(function() {
        left--;
        if (left <= 0) {
          clearInterval(shutdownInterval);
          btn.innerText = '⛔ KAPATILIYOR...';
        } else {
          btn.innerText = '⛔ İPTAL (' + left + 's)';
        }
      }, 1000);
    };

    window.onShutdownAborted = function() {
      if (shutdownInterval) { clearInterval(shutdownInterval); shutdownInterval = null; }
      const btn = document.getElementById('btnAbortShutdown');
      if (btn) btn.style.display = 'none';
    };

    window.setShutdownMode = function(mode) {
      const sel = document.getElementById('selShutdown');
      if (sel && mode) sel.value = mode;
    };

    window.addEventListener('keydown', function(e) {
      if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
        e.preventDefault();
        sendAction('nav_reload');
      } else if (e.altKey && e.key === 'ArrowLeft') {
        e.preventDefault();
        sendAction('nav_back');
      } else if (e.altKey && e.key === 'ArrowRight') {
        e.preventDefault();
        sendAction('nav_forward');
      }
    });
  </script>
</body>
</html>

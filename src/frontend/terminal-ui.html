<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umutistan • Terminal</title><link rel="stylesheet" href="ui-theme.css"><style>
body{height:100vh;display:flex;flex-direction:column;padding:clamp(16px,3vw,36px);overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:25px;font-weight:600;letter-spacing:-.5px;margin:0}.kicker{color:#40e7aa;letter-spacing:2px;font-size:11px;margin-bottom:5px}.sub{color:#82968c;font-size:13px;margin:5px 0 0}.live{display:flex;align-items:center;gap:8px;color:#8bc4a8;font-size:12px}.live:before{content:'';width:6px;height:6px;background:#40e7aa;border-radius:50%}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,button{border:1px solid #26372e;background:#0b1410;color:#d7e9df;border-radius:8px;min-height:38px;padding:8px 12px;font-size:13px}input{flex:1;min-width:140px}button{cursor:pointer}.console{border:1px solid #23332b;border-radius:12px;overflow:auto;min-height:0;flex:1;background:#030605;padding:6px 18px}.entry{display:grid;grid-template-columns:72px 82px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid #131f18;align-items:start;font:13px/1.65 Consolas,monospace}.time{color:#758b7f;font-variant-numeric:tabular-nums}.tag{font-size:11px;font-weight:600;line-height:22px;border:1px solid currentColor;border-radius:5px;text-align:center;color:#8ea99a}.msg{color:#d4e2da;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;user-select:text}.AUCTION{color:#67c8f4}.SNIPER{color:#f5c46a}.BID,.WIN{color:#43e4a5}.ERROR{color:#fa8995}.SYSTEM{color:#b3a2f3}.INFO{color:#89c9a7}.empty{padding:40px;color:#789184;text-align:center}footer{font:11px/1.5 'Segoe UI',sans-serif;color:#6f8b7a;margin-top:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}@media(max-width:600px){.entry{grid-template-columns:72px 1fr;gap:6px 12px}.tag{justify-self:start;padding:0 8px}.msg{grid-column:1/-1}.console{padding:4px 12px}h1{font-size:21px}}
</style></head><body><header><div><div class="kicker">UMUTİSTAN / WORKSPACE</div><h1>System & Sniper Terminal</h1><p class="sub">İhale, teklif ve sistem olayları. Tek bir zaman çizelgesi.</p></div><span class="live">Canlı olay akışı</span></header><div class="toolbar"><input id="search" type="search" placeholder="Olaylarda ara…" aria-label="Olaylarda ara"><select id="filter" aria-label="Olay türü"><option value="">Tüm olaylar</option><option>AUCTION</option><option>SNIPER</option><option>BID</option><option>WIN</option><option>ERROR</option><option>SYSTEM</option></select><button id="follow">Takip: açık</button></div><main id="console" class="console" aria-label="Olay günlüğü"></main><footer><span id="count">0 olay</span><span>Son 500 olay · Metni seçip kopyalayabilirsiniz</span></footer><script>
let entries=[],follow=true;const list=document.getElementById('console'),search=document.getElementById('search'),filter=document.getElementById('filter');
function render(){const top=list.scrollTop,q=search.value.toLocaleLowerCase('tr');list.replaceChildren();const visible=entries.filter(e=>(!filter.value||e.type===filter.value)&&(!q||e.message.toLocaleLowerCase('tr').includes(q)));for(const e of visible){const row=document.createElement('div');row.className='entry';for(const [cls,value]of[['time',e.time],['tag '+e.type,e.type],['msg',e.message]]){const span=document.createElement('span');span.className=cls;span.textContent=value;row.appendChild(span);}list.appendChild(row);}if(!visible.length){const blank=document.createElement('div');blank.className='empty';blank.textContent='Gösterilecek olay yok.';list.appendChild(blank);}document.getElementById('count').textContent=visible.length+' / '+entries.length+' olay';list.scrollTop=follow?list.scrollHeight:top;}
window.appendEntry=e=>{entries.push(e);entries=entries.slice(-500);render();};window.loadEntries=data=>{entries=data.slice(-500);render();};search.oninput=render;filter.onchange=render;document.getElementById('follow').onclick=function(){follow=!follow;this.textContent='Takip: '+(follow?'açık':'kapalı');render();};render();
</script></body></html>
